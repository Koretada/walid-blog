apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
  annotations:
    # Certificat TLS automatique (Let's Encrypt) si cert-manager est installé.
    # Compatible avec Traefik : cert-manager remplit `spec.tls.secretName`.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    #
    # Redirection HTTP -> HTTPS : configurée de préférence au niveau global
    # (voir k8s/README.md). Variante par Ingress, si un Middleware Traefik
    # nommé `redirect-https` existe dans ce namespace :
    # traefik.ingress.kubernetes.io/router.middlewares: walid-blog-redirect-https@kubernetescrd
spec:
  # K3s embarque Traefik : sa classe d'Ingress s'appelle `traefik`.
  # Vérifiable avec : kubectl get ingressclass
  ingressClassName: traefik
  tls:
    - hosts:
        - walidblog.example.com
      secretName: walid-blog-tls
  rules:
    - host: walidblog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: walid-blog
                port:
                  name: http
