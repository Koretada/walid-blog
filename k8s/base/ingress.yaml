apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
  annotations:
    # Certificat TLS automatique (Let's Encrypt) si cert-manager est installé :
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    #
    # Sans cert-manager, remplacez `tls.secretName` par un secret TLS existant.
    nginx.ingress.kubernetes.io/from-to-www-redirect: 'false'
spec:
  # Adaptez si votre contrôleur Ingress utilise une autre classe
  ingressClassName: nginx
  tls:
    - hosts:
        - walidblog.example.com
      secretName: walid-blog-tls
  rules:
    - host: walidblog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: walid-blog
                port:
                  name: http
