apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
  annotations:
    # Certificat géré par cert-manager : le secret `walid-blog-tls` est produit
    # par la ressource Certificate de base/certificate.yaml.
    #
    # Variante « shim » (cert-manager >= 1.15, support Gateway API activé) :
    # décommentez la ligne ci-dessous et supprimez base/certificate.yaml —
    # cert-manager créera le Certificate et le secret automatiquement.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # GatewayClass fournie par Traefik.
  # Prérequis : providers.kubernetesGateway.enabled = true (voir k8s/README.md)
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      # ⚠️ Le port DOIT correspondre à un EntryPoint Traefik.
      # 8000 = entrypoint « web » (valeurs par défaut K3s / chart Helm).
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      # ⚠️ 8443 = entrypoint « websecure ». Le Service Traefik expose 443 → 8443.
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: walid-blog-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
