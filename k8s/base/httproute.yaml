# Route principale : sert le blog en HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: walid-blog
      sectionName: https
  hostnames:
    - blog.walidb.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: walid-blog
          port: 80
          weight: 1

---
# Redirection HTTP -> HTTPS.
# Filtre natif de l'API Gateway : aucun Middleware Traefik nécessaire.
# `statusCode: 301` avec `scheme: https` et sans `port` → redirection vers le
# port 443 implicite (le Service Traefik expose bien 443).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: walid-blog-redirect
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: walid-blog
      sectionName: http
  hostnames:
    - blog.walidb.fr
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
