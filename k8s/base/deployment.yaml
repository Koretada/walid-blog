apiVersion: apps/v1
kind: Deployment
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
spec:
  # 1 replica : sur un cluster mono-nœud (VPS K3s), une 2e réplica ne procure
  # aucune haute disponibilité — le nœud reste de toute façon un point de
  # défaillance unique — tout en doublant la consommation de ressources.
  #
  # Avec `maxUnavailable: 0`, Kubernetes démarre le nouveau pod AVANT d'arrêter
  # l'ancien : le service n'est jamais interrompu, et la fenêtre pendant laquelle
  # deux versions coexistent se réduit à la mise à jour des endpoints (≈ 1 s).
  # Avec 2 réplicas, cette fenêtre durait le temps de remplacer deux pods
  # successivement (plusieurs dizaines de secondes).
  #
  # ⚠️ Garantir qu'AUCUNE requête ne voie deux versions simultanément imposerait
  # `strategy: Recreate` (maxSurge: 0) : l'ancien pod est alors supprimé avant que
  # le nouveau ne démarre, ce qui provoque une coupure de plusieurs secondes à
  # chaque déploiement. Mauvais compromis pour un site public.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: walid-blog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: walid-blog
        app.kubernetes.io/component: web
    spec:
      # L'image de runtime (nginxinc/nginx-unprivileged) démarre en uid 101 et
      # n'effectue aucun chown : elle est donc compatible avec drop: [ALL].
      # Profil « restricted » des Pod Security Standards.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Le tag est mis à jour automatiquement par la CI dans l'overlay prod
          image: ghcr.io/koretada/walid-blog:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
