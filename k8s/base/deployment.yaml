apiVersion: apps/v1
kind: Deployment
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
spec:
  # 1 replica : sur un cluster mono-nœud (VPS K3s), une 2e réplica ne procure
  # aucune haute disponibilité — le nœud reste de toute façon un point de
  # défaillance unique — et la fenêtre pendant laquelle deux versions coexistent
  # lors d'un déploiement est supprimée.
  #
  # ⚠️ Compromis MESURÉ (260 requêtes espacées de 2 s pendant un déploiement) :
  # `maxUnavailable: 0` fait bien démarrer le nouveau pod avant d'arrêter
  # l'ancien (vérifié dans les événements : « Started » puis « Killing »), mais
  # la propagation du nouvel endpoint jusqu'à Traefik laisse un trou pendant
  # lequel plus aucun backend ne répond : 1 requête sur 260 en échec, aucune
  # réponse pendant ~5 à 9 s. Bascule de version nette (aucune réponse n'a servi
  # les deux versions), contre une brève coupure à chaque déploiement.
  #
  # Avec 2 réplicas, le pod restant masque ce délai (déploiement sans coupure),
  # au prix d'une coexistence des versions plus longue.
  #
  # Aucun réglage ne donne à la fois zéro coupure ET une seule version servie :
  # il faut au minimum un pod qui réponde pendant que l'autre démarre.
  # `strategy: Recreate` irait plus loin dans la coupure ; si la disponibilité
  # primait sur tout le reste, il faudrait repasser à 2 réplicas.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: walid-blog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: walid-blog
        app.kubernetes.io/component: web
    spec:
      # L'image de runtime (nginxinc/nginx-unprivileged) démarre en uid 101 et
      # n'effectue aucun chown : elle est donc compatible avec drop: [ALL].
      # Profil « restricted » des Pod Security Standards.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Le tag est mis à jour automatiquement par la CI dans l'overlay prod
          image: ghcr.io/koretada/walid-blog:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
