apiVersion: apps/v1
kind: Deployment
metadata:
  name: walid-blog
  labels:
    app.kubernetes.io/name: walid-blog
    app.kubernetes.io/component: web
spec:
  # 2 replicas : permet un rolling update sans coupure (maxUnavailable: 0)
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: walid-blog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: walid-blog
        app.kubernetes.io/component: web
    spec:
      # L'image de runtime (nginxinc/nginx-unprivileged) démarre en uid 101 et
      # n'effectue aucun chown : elle est donc compatible avec drop: [ALL].
      # Profil « restricted » des Pod Security Standards.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Le tag est mis à jour automatiquement par la CI dans l'overlay prod
          image: ghcr.io/koretada/walid-blog:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
