# Application conteneurisée « walidblog ».
#
#   docker compose -f docker/docker-compose.yml up --build
#   → http://localhost:8080
#
# Le contexte de build est la racine du dépôt (../) : le Dockerfile a besoin
# de src/, public/, astro.config.mjs, etc.

name: walidblog

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: walidblog:local
    container_name: walidblog
    ports:
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
