# Configuration Nginx pour le site statique « walidblog ».
# Montée dans /etc/nginx/conf.d/default.conf par le Dockerfile.

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------------
    # Redirections RELATIVES
    # nginx génère par défaut des redirections absolues en utilisant son port
    # d'écoute interne (8080) et sans connaître le schéma externe. Derrière un
    # reverse proxy, cela produit des « 301 Location: http://host:8080/... »
    # vers un port non exposé. Désactivé ici : nginx émet « Location: /chemin/ ».
    # ---------------------------------------------------------------------
    absolute_redirect off;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types      text/plain
                    text/css
                    text/xml
                    application/javascript
                    application/json
                    application/xml
                    application/rss+xml
                    image/svg+xml;

    # ---------------------------------------------------------------------
    # En-têtes de sécurité
    # Déclarés au niveau `server` : ils sont hérités par tous les blocs
    # `location`, car `expires` (utilisé plus bas) ne casse pas cet héritage
    # contrairement à `add_header`.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---------------------------------------------------------------------
    # Assets fingerprintés par Astro → cache d'un an
    # ---------------------------------------------------------------------
    location /_astro/ {
        expires   1y;
        try_files $uri =404;
    }

    # Index de recherche Pagefind (assets fingerprintés)
    location /pagefind/ {
        expires   1y;
        try_files $uri =404;
    }

    # Images et polices
    location ~* \.(?:svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
        expires   30d;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Pages générées par Astro (/blog/mon-article → .../mon-article/index.html)
    #
    # `$uri/index.html` est testé AVANT `$uri/` : try_files ignore les
    # répertoires sauf si le chemin se termine par « / ». Une requête sans slash
    # final (/blog) est donc servie directement, sans la redirection de
    # répertoire qui renvoyait vers http://host:8080/blog/.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    # ---------------------------------------------------------------------
    # Page 404 personnalisée produite par Astro
    # ---------------------------------------------------------------------
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
