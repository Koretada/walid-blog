version: 2

updates:
  # Dépendances npm (Astro, Tailwind, Pagefind…)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
    commit-message:
      prefix: chore
      include: scope

  # Images de base du Dockerfile (node, nginx) — correctifs de sécurité
  - package-ecosystem: docker
    directory: '/docker'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope

  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
