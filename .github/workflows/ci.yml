name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule les exécutions obsolètes sur une même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job bloquant : lint, types, build (inclut l'index de recherche Pagefind)
  build:
    name: Lint · Types · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier)
        run: npm run lint

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Job informatif : budget de performance (non bloquant, best-effort)
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Job informatif : vérification des liens (non bloquant)
  links:
    name: Link check
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,206,429 'src/content/**/*.md' 'src/content/**/*.mdx'
          fail: false

  # Job bloquant : l'image Docker est notre artefact de livraison,
  # on vérifie qu'elle se construit ET que le conteneur sert bien le site.
  docker:
    name: Docker build · smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: walidblog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -uo pipefail

          docker run -d --name walidblog-ci -p 8080:8080 walidblog:ci

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Le site ne répond pas sur http://localhost:8080/"
            docker logs walidblog-ci
            docker rm -f walidblog-ci
            exit 1
          fi

          echo "✅ Le site répond."
          curl -fsSI http://localhost:8080/ | head -15
          docker rm -f walidblog-ci
