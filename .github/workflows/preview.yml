name: Preview (Pull Request)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview (Cloudflare Pages)
    runs-on: ubuntu-latest
    # Actif dès que les secrets Cloudflare sont configurés (sinon, étapes ignorées)
    env:
      CF_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Déploiement de prévisualisation optionnel.
      # Nécessite les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID
      # et un projet Pages nommé "walidblog". Ignoré si non configuré.
      - name: Deploy to Cloudflare Pages
        id: cf
        if: ${{ env.CF_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=walidblog --branch=${{ github.head_ref }}

      - name: Comment preview URL
        if: ${{ steps.cf.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.cf.outputs.deployment-url }}`;
            const body = `🔍 **Preview deploy** : ${url}\n\n_Commit ${context.sha.slice(0, 7)}_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previous = comments.find((c) => c.body.includes('Preview deploy'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
