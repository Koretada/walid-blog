name: Publish image (GHCR)

# Construit et publie l'image de production sur GitHub Container Registry.
# Déclenché à chaque merge sur `main` (tag `latest` + `sha-<court>`)
# et sur un tag Git `v*` (tag de version lisible).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  # contents: write → nécessaire pour committer le bump du tag (boucle GitOps)
  contents: write
  packages: write

jobs:
  publish:
    name: Build & push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # `github.repository` = Koretada/walid-blog → metadata-action met en minuscules
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Réutilise la couche `npm ci` d'un build à l'autre : un nouvel
          # article ne rejoue que `COPY . .` + `npm run build`.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Boucle GitOps : on reporte dans Git le tag de l'image fraîchement
      # publiée. ArgoCD détectera ce commit et synchronisera le cluster.
      #
      # Le suffixe `[skip ci]` évite que ce commit ne relance la CI en boucle.
      # ---------------------------------------------------------------------
      - name: Bump de l'image dans l'overlay prod (GitOps)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          FILE="k8s/overlays/prod/kustomization.yaml"

          if grep -q "newTag: ${TAG}" "${FILE}"; then
            echo "Le manifeste référence déjà ${TAG} — rien à faire."
            exit 0
          fi

          sed -i "s|newTag: .*|newTag: ${TAG}|" "${FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILE}"
          git commit -m "chore(deploy): walid-blog ${TAG} [skip ci]"
          git push
